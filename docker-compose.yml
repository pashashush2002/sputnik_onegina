services:
    server:
        build: ./8080
        container_name: server
        environment:
        - SERVER_PORT=8080
        ports:
        - "3030:8080"
    mission-service:
        build: ./8081
        container_name: mission-service
        depends_on:
        - server
        environment:
        - SERVER_PORT=8081
        - SERVER_URL=http://server:8080
        ports:
        - "3031:8081"