server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: "*"

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/satellite_db}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    sql:
      init:
        mode: always

grpc:
    client:
        telemetry-service:
            address: static://telemtetry-service:9091
            negotiationType: plaintext
            enable-keep-alive: true
            keep-alive-time: 30s
            keep-alive-timeout: 5s
